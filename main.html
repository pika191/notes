<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Notes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Theme toggle -->
    <div id="themeToggle" class="theme-toggle">
        <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
    </div>

    <!-- Header info -->
    <div class="header-info">
        <div id="digitalClock" class="digital-clock"></div>


        <!-- Crypto prices -->
        <div id="cryptoPrices" class="crypto-prices">
            <div class="crypto-header">
                <span>💰 Crypto</span>
                <button id="refreshCrypto" class="refresh-btn">↻</button>
            </div>
            <div id="cryptoContainer" class="crypto-container">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>Notes</h1>

        <button id="toggleFormBtn" class="toggle-form-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
      <span>Tambah Catatan</span>
    </button>

        <!-- Form catatan -->
        <form id="noteForm" class="hidden">
            <input type="hidden" id="noteId">
            <label for="title">Judul Catatan</label>
            <input type="text" id="title" placeholder="Masukkan judul catatan" required>

            <label for="content">Isi Catatan</label>
            <textarea id="content" placeholder="Tulis catatan Anda di sini..."></textarea>

            <div class="text-styling-options">
                <label><input type="checkbox" id="boldText"> Bold</label>
                <label><input type="checkbox" id="italicText"> Italic</label>
                <label for="fontColor">Warna:</label>
                <input type="color" id="fontColor" value="#2c3e50">
            </div>

            <label for="reminder">Pengingat</label>
            <input type="datetime-local" id="reminder">

            <div class="form-buttons">
                <button type="submit" id="submitBtn">Simpan</button>
                <button type="button" id="cancelBtn" class="hidden">Batal</button>
            </div>
        </form>

        <!-- Tabs -->
        <div class="tabs-container">
            <div class="tab-buttons">
                <button class="tab-button active" data-tab="active">Aktif</button>
                <button class="tab-button" data-tab="history">Arsip</button>
            </div>

            <div id="activeNotes" class="tab-content active">
                <div id="notesContainer"></div>
            </div>

            <div id="historyNotes" class="tab-content hidden">
                <div id="historyContainer"></div>
            </div>
        </div>
    </div>

    <body>
        <div class="container">

            <script src="app.js"></script>
    </body>

</html>
